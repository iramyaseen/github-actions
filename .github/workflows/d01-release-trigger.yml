name: D01 Release Trigger

env:
  REPOSITORY: iramyaseen/github-actions
  ENVIRONMENT: prod

on:
  release:
    types: [published]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: prod
        type: choice
        options:
          - prod
          - stag
          - dev
      is_approved:
        description: Release approved
        required: true
        default: false
        type: boolean
      approver_name:
        description: Approver name
        required: true
        default: mussa
        type: string

jobs:
  trigger-d01:
    if: github.event_name == 'release' || github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Gripo D01 Workflow
        env:
          GRIPO_WEBHOOK_URL: ${{ secrets.GRIPO_D01_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            BRANCH="main"
            TAG="${{ github.event.release.tag_name }}"
            COMMIT="${{ github.sha }}"
            ENV_NAME="${{ env.ENVIRONMENT }}"
            IS_APPROVED=false
            APPROVER="mussa"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="main"
            TAG="${{ github.ref_name }}"
            COMMIT="${{ github.sha }}"
            ENV_NAME="${{ inputs.environment }}"
            IS_APPROVED=${{ inputs.is_approved }}
            APPROVER="${{ inputs.approver_name }}"
          else
            BRANCH="${{ github.event.pull_request.base.ref }}"
            TAG="${{ github.sha }}"
            COMMIT="${{ github.sha }}"
            ENV_NAME="${{ env.ENVIRONMENT }}"
            IS_APPROVED=false
            APPROVER="${{ github.actor }}"
          fi

          curl --fail-with-body -X POST "$GRIPO_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"branch\": \"${BRANCH}\",
              \"commit\": \"${COMMIT}\",
              \"repository\": \"${{ env.REPOSITORY }}\",
              \"tag\": \"${TAG}\",
              \"isApproved\": ${IS_APPROVED},
              \"approverName\": \"${APPROVER}\",
              \"env\": \"${ENV_NAME}\"
            }"
