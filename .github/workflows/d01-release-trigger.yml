name: D01 Release Trigger

env:
  REPOSITORY: iramyaseen/github-actions

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  trigger-d01:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Gripo D01 Workflow
        env:
          GRIPO_WEBHOOK_URL: ${{ secrets.GRIPO_D01_WEBHOOK_URL }}
        run: |
          curl --fail-with-body -X POST "$GRIPO_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"version\": \"1.0.0\",
              \"repository\": \"${{ env.REPOSITORY }}\",
              \"ref\": \"${{ github.ref }}\",
              \"sha\": \"${{ github.sha }}\",
              \"pr\": ${{ github.event.pull_request.number || 0 }},
              \"imageTag\": \"${{ github.sha }}\",
              \"releaseId\": \"${{ github.run_id }}\",
              \"triggeredBy\": \"${{ github.actor }}\"
            }"
